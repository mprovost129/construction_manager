<header class="app-header">
    <nav class="app-nav" aria-label="Primary navigation">
        <a class="app-brand" href="{% url 'core:home' %}">
            <span class="app-brand__mark" aria-hidden="true"><i class="bi bi-buildings"></i></span>
            <span>Construction Manager</span>
        </a>
        <button class="app-nav__toggle" type="button" aria-expanded="false" aria-controls="primary-nav-menu">
            <span class="visually-hidden">Open navigation</span>
            <i class="bi bi-list" aria-hidden="true"></i>
        </button>
        <div class="app-nav__menu" id="primary-nav-menu">
            <a class="app-nav__link" href="{% url 'core:home' %}">Projects</a>
            {% if has_internal_access %}
                <a class="app-nav__link" href="{% url 'projects:company_list' %}">Company</a>
            {% endif %}
            {% if can_manage_integrations %}
                <a class="app-nav__link" href="{% url 'integrations:quickbooks_connect' %}">QuickBooks</a>
            {% endif %}
            <a class="app-nav__link" href="{% url 'core:help' %}">Help</a>
            {% if user.is_authenticated %}
                <span class="app-nav__identity">{{ user.email }}</span>
                <form method="post" action="{% url 'logout' %}" class="app-nav__logout">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm btn-outline-light">Log out</button>
                </form>
            {% else %}
                <a class="btn btn-sm btn-light app-nav__login" href="{% url 'login' %}">Log in</a>
            {% endif %}
        </div>
    </nav>
</header>
