<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#123d2d">
    <title>Offline | Construction Manager</title>
    <style>
        * { box-sizing: border-box; }
        body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 1.5rem; color: #17231d; background: #f3f5f2; font-family: Inter, system-ui, sans-serif; }
        main { width: min(100%, 480px); padding: 2rem; border: 1px solid #dfe4e0; border-radius: 16px; background: white; box-shadow: 0 18px 50px rgba(32, 51, 42, 0.08); text-align: center; }
        .mark { display: grid; width: 58px; height: 58px; margin: 0 auto 1.25rem; border-radius: 14px; place-items: center; color: #123d2d; background: #dfb95f; font-size: 1.6rem; font-weight: 800; }
        h1 { margin: 0 0 0.65rem; font-size: 1.8rem; }
        p { margin: 0; color: #68756e; line-height: 1.55; }
        button { margin-top: 1.4rem; padding: 0.7rem 1rem; border: 0; border-radius: 8px; color: white; background: #174f3a; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">CM</div>
        <h1>You are offline</h1>
        <p>Construction Manager cannot load project information without an internet connection. Reconnect and try again.</p>
        <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
</body>
</html>
