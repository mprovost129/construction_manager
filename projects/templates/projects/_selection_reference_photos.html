{% if reference_photos %}<section class="admin-panel"><h2>Reference photos</h2><p>Supporting photos from Buildertrend. These do not create or change a selection approval.</p><div style="display:flex;flex-wrap:wrap;gap:1rem">{% for photo in reference_photos %}<figure style="max-width:280px;margin:0"><a href="{% url 'projects:selection_reference_image' project.pk selection.pk photo.pk %}"><img style="width:100%;height:200px;object-fit:contain;background:#fff" loading="lazy" src="{% url 'projects:selection_reference_image' project.pk selection.pk photo.pk %}" alt="{{ photo.caption }}"></a><figcaption>{{ photo.caption }}{% if can_manage_project %}<small>{% if photo.client_visible %} · Shared with client{% else %} · Internal reference{% endif %}</small>{% endif %}</figcaption></figure>{% endfor %}</div></section>{% endif %}
